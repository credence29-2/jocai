  $("#setBody").onclick = async e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.add) editIdentity({ accountId: t.dataset.add, email: "", name: acctById(t.dataset.add).name || "", signatureHtml: "", signatureOnReplies: true });
    if (t.dataset.edit) editIdentity(identById(t.dataset.edit));
    if (t.dataset.import) {
      t.disabled = true;
      try {
        const r = await api("/api/aliases/import", { accountId: t.dataset.import });
        toast(r.added ? `Added ${r.added} address${r.added === 1 ? "" : "es"}` : "No new addresses found");
        await refreshState(); renderIdentities();
      } catch (err) { toast(err.message, 6000); t.disabled = false; }
    }
  };
}
const sigText = h => { const d = document.createElement("div"); d.innerHTML = h.replace(/<br\s*\/?>|<\/(div|p|li)>/gi, "$& "); return d.textContent.replace(/\s+/g, " ").trim(); };

function editIdentity(i) {
  const a = acctById(i.accountId);
  const isNew = !i.id;
  const box = document.createElement("div");
  box.innerHTML = `<div class="overlay"><div class="dialog" style="max-width:680px">
    <div class="dlg-head"><h3>${isNew ? "Add alias" : "Edit " + esc(i.email)}</h3><button class="x" data-x>${icon("x")}</button></div>
    <div class="dlg-body">
      <div class="id-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px">
        <label class="field"><span>Email address</span><input class="input" id="iEmail" value="${esc(i.email)}" ${i.imported ? "readonly" : ""} spellcheck="false"></label>
        <label class="field"><span>Name people see</span><input class="input" id="iName" value="${esc(i.name)}"></label>
      </div>
      <label class="field"><span>Replies go to (optional)</span><input class="input" id="iReply" value="${esc(i.replyTo || "")}" placeholder="Leave blank to use the address above" spellcheck="false"></label>
      <div class="field"><span style="display:flex;align-items:center;gap:10px">Signature${a.provider === "gmail" ? '<button class="link" id="iPull" type="button" title="Replace this with the signature Gmail uses for this address">Pull from Gmail</button>' : ""}</span><div class="sig-box">${fmtBar()}<div class="editor sig-editor" id="iSig" contenteditable="true"></div></div></div>
      <label class="check"><input type="checkbox" id="iOnReplies" ${i.signatureOnReplies ? "checked" : ""}>Add the signature to replies and forwards</label>
      <label class="check"><input type="checkbox" id="iDefault" ${i.default ? "checked" : ""}>Default From address for ${esc(a.name || a.email)}</label>
      ${isNew ? `<p class="muted" style="line-height:1.5;margin:6px 0 0">${a.provider === "gmail" ?
        "Gmail only sends from addresses verified in Gmail under Settings, Accounts, Send mail as. Add it there first, then use Sync from Gmail, or Gmail will swap in your main address." :
        "Outlook only sends from aliases set up on this Microsoft account (account.microsoft.com, Your info, Edit account info). Work accounts need the admin to allow sending from aliases."}</p>` : ""}
      <div class="err" id="iErr"></div>
    </div>
    <div class="dlg-foot">${isNew ? "" : '<button class="btn ghost danger" id="iDel">Delete</button>'}<span class="grow"></span>
      <button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="iSave">Save</button></div></div></div>`;
  $("#modal").append(box);
  const sig = box.querySelector("#iSig");
  sig.innerHTML = i.signatureHtml || "";
  wireFmt(box, sig);
  box.querySelectorAll("[data-x]").forEach(b => (b.onclick = () => box.remove()));
  const pull = box.querySelector("#iPull");
  if (pull) pull.onclick = async () => {
    box.querySelector("#iErr").textContent = "";
    pull.disabled = true; pull.textContent = "Pulling...";
    try {
      const al = await api("/api/aliases/signature", { accountId: i.accountId, email: box.querySelector("#iEmail").value.trim() });
      sig.innerHTML = al.signatureHtml;
      toast("Pulled from Gmail. Click Save to keep it.");
    } catch (e) { box.querySelector("#iErr").textContent = e.message; }
    pull.disabled = false; pull.textContent = "Pull from Gmail";
  };
  box.querySelector("#iSave").onclick = async () => {
    const out = { ...i, email: box.querySelector("#iEmail").value.trim(), name: box.querySelector("#iName").value.trim(),
      replyTo: box.querySelector("#iReply").value.trim(), signatureHtml: sig.textContent.trim() || sig.querySelector("img") ? sig.innerHTML : "",
      signatureOnReplies: box.querySelector("#iOnReplies").checked, default: box.querySelector("#iDefault").checked };
    try { await api("/api/identity", out); } catch (e) { box.querySelector("#iErr").textContent = e.message; return; }
    box.remove(); await refreshState(); renderIdentities();
  };
  const del = box.querySelector("#iDel");
  if (del) del.onclick = async () => {
    if (!(await ask(`Delete ${i.email} and its signature from Project Echo Mike?`, { ok: "Delete", danger: true }))) return;
    try { await api("/api/identity/delete", { id: i.id }); } catch (e) { box.querySelector("#iErr").textContent = e.message; return; }
    box.remove(); await refreshState(); renderIdentities();
  };
}

function renderSetup() {
  const st = S.settings;
  $("#setBody").innerHTML = `
    <p class="muted" style="line-height:1.55;margin-top:0;max-width:760px">Google and Microsoft only let an app read mail after it's registered with them. You register Project Echo Mike once under your own Google and Microsoft accounts, then paste the IDs here. It's free and takes about 10 minutes each. Your mail goes straight from Google and Microsoft to this PC. It never passes through anyone else's server.</p>
    <div class="card"><h4>Google (Gmail)</h4>
      <ol class="steps">
        <li>Go to <button class="link" data-open="https://console.cloud.google.com/projectcreate">console.cloud.google.com</button> and create a project named Project Echo Mike.</li>
        <li>In <b>APIs and Services, Library</b>, turn on the <b>Gmail API</b>.</li>
        <li>In <b>Google Auth Platform</b> (OAuth consent screen), choose <b>External</b>, fill in the app name and your email. Under <b>Data access</b>, add the scope <code>https://www.googleapis.com/auth/gmail.modify</code>.</li>
        <li>Under <b>Audience</b>, click <b>Publish app</b>. If you leave it in Testing, Google signs you out every 7 days.</li>
        <li>Under <b>Clients</b>, create an OAuth client of type <b>Desktop app</b>. Copy its Client ID and Client secret below.</li>
      </ol>
      <label class="field"><span>Client ID</span><input class="input" id="gId" value="${esc(st.googleClientId)}" spellcheck="false" placeholder="1234-abc.apps.googleusercontent.com"></label>
      <label class="field"><span>Client secret</span><input class="input" id="gSecret" type="password" value="${esc(st.googleClientSecret)}" spellcheck="false" placeholder="GOCSPX-..."></label>
    </div>
    <div class="card"><h4>Microsoft (Outlook.com, Hotmail, Microsoft 365)</h4>
      <ol class="steps">
        <li>Go to <button class="link" data-open="https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade">entra.microsoft.com, App registrations</button> and click <b>New registration</b>. A free personal Microsoft account works.</li>
        <li>Name it Project Echo Mike. For account types, pick <b>Any Entra ID tenant and personal Microsoft accounts</b>.</li>
        <li>For Redirect URI, pick <b>Public client/native (mobile and desktop)</b> and enter <code>http://localhost</code>.</li>
        <li>Open <b>API permissions</b>, add Microsoft Graph delegated permissions <code>Mail.ReadWrite</code>, <code>Mail.Send</code>, <code>Calendars.ReadWrite</code>, <code>User.Read</code>, <code>offline_access</code>, and <code>SMTP.Send</code>.</li>
        <li>Copy the <b>Application (client) ID</b> from Overview below. No secret is needed.</li>
      </ol>
      <label class="field"><span>Application (client) ID</span><input class="input" id="mId" value="${esc(st.microsoftClientId)}" spellcheck="false" placeholder="00000000-0000-0000-0000-000000000000"></label>
    </div>
    <button class="btn primary" id="setupSave">Save</button> <span class="muted" id="setupMsg"></span>`;
  $("#setBody").onclick = e => { if (e.target.dataset.open) api(dl("/open", { u: e.target.dataset.open })).catch(() => {}); };
  $("#setupSave").onclick = async () => {
    try {
      await api("/api/settings", { ...S.settings, googleClientId: $("#gId").value, googleClientSecret: $("#gSecret").value, microsoftClientId: $("#mId").value });
      await refreshState();
      $("#setupMsg").textContent = "Saved. Add your accounts on the Accounts tab.";
    } catch (e) { $("#setupMsg").textContent = e.message; }
  };
}

function renderGeneral() {
  $("#setBody").innerHTML = `
    <label class="check"><input type="checkbox" id="gNotify" ${S.settings.muteNotifications ? "" : "checked"}>Show a Windows notification when new mail arrives</label>
    <p class="muted" style="margin:-4px 0 18px 26px;line-height:1.5;max-width:640px">Checks every minute while Project Echo Mike is open. You can also turn this on and off with the bell at the bottom of the sidebar. Windows Do not disturb is respected.</p>
    <label class="check"><input type="checkbox" id="gDark" ${S.settings.lightMessages ? "" : "checked"}>Show emails and the compose window in dark mode</label>
    <p class="muted" style="margin:-4px 0 18px 26px;line-height:1.5;max-width:640px">Colors in emails are adjusted to read well on dark. If one looks off, use the sun button above that message to see it on white. What you send always looks normal to the people you send it to.</p>
    <label class="check"><input type="checkbox" id="gImages" ${S.settings.loadImages ? "checked" : ""}>Show remote images automatically</label>
    <p class="muted" style="margin:-4px 0 18px 26px;line-height:1.5;max-width:640px">Off is safer. Senders use hidden images to see when and where you opened their email.</p>
    <h4 style="margin:20px 0 8px">Keyboard shortcuts</h4>
    <div class="muted" style="line-height:1.9">
      <span class="code">C</span> new message &nbsp; <span class="code">R</span> reply &nbsp; <span class="code">A</span> reply all &nbsp; <span class="code">F</span> forward<br>
      <span class="code">E</span> archive &nbsp; <span class="code">Del</span> delete &nbsp; <span class="code">S</span> star &nbsp; <span class="code">U</span> mark unread<br>
      <span class="code">J</span> / <span class="code">K</span> next and previous &nbsp; <span class="code">X</span> select &nbsp; <span class="code">/</span> search &nbsp; <span class="code">Ctrl+Enter</span> send
    </div>
    <h4 style="margin:20px 0 8px">Updates</h4>
    <div id="updBox" class="muted" style="line-height:1.6">Project Echo Mike ${esc(S.version)}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="updCheck">Check for updates</button><button class="btn small primary" id="updInstall" hidden>Install and restart</button></div>`;
  renderUpdate();
  $("#updCheck").onclick = async () => {
    $("#updCheck").disabled = true; $("#updBox").textContent = "Checking...";
    try { S.update = await api("/api/update/check", {}); } catch (e) { $("#updBox").textContent = e.message; }
    $("#updCheck").disabled = false; renderUpdate();
  };
  $("#updInstall").onclick = installUpdate;
  $("#gNotify").onchange = e => setMute(!e.target.checked);
  $("#gDark").onchange = async e => {
    try { await api("/api/settings", { ...S.settings, lightMessages: !e.target.checked }); await refreshState(); if (S.msg) { S.lightMsg = false; renderReader(); } } catch (err) { toast(err.message); }
  };
  $("#gImages").onchange = async e => {
    try { await api("/api/settings", { ...S.settings, loadImages: e.target.checked }); await refreshState(); } catch (err) { toast(err.message); }
  };
}

$("#settingsBtn").onclick = () => { setDrawer(false); openSettings(); };

// Updates: the app checks on its own once a day and the desktop calls
// onUpdate; Settings has a button too.
function renderUpdate() {
  const box = $("#updBox"); if (!box) return;
  const u = S.update;
  if (!S.updates) { box.textContent = `Project Echo Mike ${S.version}. ${ANDROID ? "The phone app updates from the download link." : "Updates aren't available in this build."}`; $("#updCheck").hidden = true; return; }
  if (!u) { box.textContent = `Project Echo Mike ${S.version}`; return; }
  if (u.error) { box.textContent = `Project Echo Mike ${S.version}. Couldn't check: ${u.error}`; return; }
  box.textContent = u.available ? `Version ${u.latest} is available. You have ${S.version}.` : `Project Echo Mike ${S.version} is up to date.`;
  $("#updInstall").hidden = !u.available;
}
async function installUpdate() {
  const btn = $("#updInstall");
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Downloading'; }
  toast("Downloading the update. The app restarts when it's done.", 60000);
  try { await api("/api/update/install", {}); }
  catch (e) { toast("Update failed: " + e.message, 8000); if (btn) { btn.disabled = false; btn.textContent = "Install and restart"; } }
}
window.onUpdate = latest => {
  S.update = { available: true, latest };
  toast(`Version ${latest} is available.`, 15000, { label: "Install and restart", run: installUpdate });
  renderUpdate();
};

function renderMute() {
  const off = !!S.settings.muteNotifications;
  $("#muteBtn").innerHTML = icon(off ? "bellOff" : "bell") + (off ? "Notifications off" : "Notifications on");
  $("#muteBtn").title = off ? "Turn new-mail notifications back on" : "Pause new-mail notifications";
  $("#muteBtn").classList.toggle("muted-on", off);
}
async function setMute(off) {
  try { await api("/api/settings", { ...S.settings, muteNotifications: off }); await refreshState(); toast(off ? "Notifications off" : "Notifications on"); }
  catch (e) { toast(e.message); }
}
$("#muteBtn").onclick = () => setMute(!S.settings.muteNotifications);

// The desktop app calls this when new mail arrives.
window.onNewMail = () => {
  pollUnread();
  if (S.folder === "inbox" && !S.query && !S.loading) loadList.quiet();
};

/* ---------- keyboard ---------- */
// Escape closes only the topmost window.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const top = [...document.querySelectorAll("#modal .overlay")].pop();
  const btn = top && (top.querySelector("[data-x]") || top.querySelector("[data-close]"));
  if (btn) { e.preventDefault(); e.stopImmediatePropagation(); btn.click(); }
}, true);
document.addEventListener("keydown", e => {
  if ($("#modal").innerHTML || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  const k = e.key.toLowerCase();
  const idx = S.sel ? S.messages.findIndex(m => rowKey(m) === S.sel.key) : -1;
  const map = { c: () => compose(), r: () => act("reply"), a: () => act("replyAll"), f: () => act("forward"), e: () => act("archive"),
    delete: () => act("trash"), "#": () => act("trash"), s: () => act("star"), u: () => act("unread"),
    j: () => openMessage(S.messages[idx + 1]), k: () => idx > 0 && openMessage(S.messages[idx - 1]),
    "/": () => $("#search").focus(),
    x: () => { if (idx >= 0) { const k = rowKey(S.messages[idx]); S.checked.has(k) ? S.checked.delete(k) : S.checked.add(k); renderList(); } } };
  if (map[k]) { e.preventDefault(); map[k](); }
});

/* ---------- startup ---------- */
async function refreshState() {
  const st = await api("/api/state");
  Object.assign(S, { accounts: st.accounts, identities: st.identities, settings: st.settings, demo: st.demo, version: st.version, updates: !!st.updates });
  $("#demoFlag").hidden = !S.demo;
  renderMute();
  document.body.classList.toggle("dark-mail", !S.settings.lightMessages);
  renderSidebar();
}
async function pollUnread() {
  try { S.unread = await api("/api/unread"); renderSidebar(); } catch {}
}
(async () => {
  try { await refreshState(); } catch (e) {
    document.body.innerHTML = `<div class="empty"><h2>Project Echo Mike couldn't start</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  renderEmptyReader();
  if (S.accounts.length) { loadList(); pollUnread(); } else renderList();
  setInterval(() => {
    if (document.hidden) return;
    pollUnread();
    if (S.folder === "inbox" && !S.query && !S.loading && !$("#list").scrollTop) loadList.quiet();
  }, 180000);
})();
// quiet reloads the list without clearing it first, for the background check.
loadList.quiet = async () => {
  try {
    const r = await api("/api/list", { folder: "inbox", query: "", accountId: S.account, group: true });
    if (S.folder !== "inbox" || S.query) return;
    S.messages = r.messages; S.cursors = r.cursors; S.errors = r.errors;
    renderList();
  } catch {}
};
</script>
