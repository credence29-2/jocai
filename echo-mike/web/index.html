<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Echo Mike</title>
<style>
:root {
  --bg: #20232b; --side: #1b1e25; --panel: #2a2e37; --card: #323742; --card2: #3a404c; --hover: #444b58;
  --line: #3f4551; --text: #f1f3f6; --sub: #b4bbc6; --dim: #858d99;
  --accent: #2f7cf6; --accent-hi: #4b8ff8; --good: #34c77b; --warn: #f2a93b; --bad: #ef5d5a; --star: #f5c542;
  font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; color: var(--text); background: var(--bg);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { display: flex; background: var(--side); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
input, select, textarea { font: inherit; color: inherit; }
svg { flex: none; }
[hidden] { display: none !important; }
.muted { color: var(--sub); }
.dim { color: var(--dim); }

/* ---------- sidebar ---------- */
.sidebar { width: 232px; flex: none; display: flex; flex-direction: column; padding: 16px 8px 12px; user-select: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.brand b { display: block; font-size: 15px; }
.brand span { display: block; font-size: 12px; color: var(--sub); }
.compose-btn { margin: 0 4px 16px; height: 42px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.compose-btn:hover { background: var(--accent-hi); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: none; color: #d9dde3; font-weight: 600; text-align: left; }
.nav button:hover { background: #262a33; color: #fff; }
.nav button.active { background: #2d3442; color: #fff; }
.nav button.active svg { color: var(--accent-hi); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--sub); font-weight: 600; }
.side-label { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); padding: 18px 12px 6px; }
.acct-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.nav .acct-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.nav .warn-badge { margin-left: auto; color: var(--warn); font-size: 12px; }
.side-spacer { flex: 1; }
.side-foot { border-top: 1px solid #2a2e37; padding-top: 8px; }
#muteBtn.muted-on { color: var(--warn); }

/* ---------- main layout ---------- */
main { flex: 1; min-width: 0; display: flex; background: var(--panel); margin: 10px 10px 10px 0; border-radius: 10px; overflow: hidden; }
.list-pane { width: 400px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); }
.read-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.searchbar { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; height: 36px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; border: 0; background: none; outline: none; min-width: 0; }
.search .icon-btn { width: 28px; height: 28px; margin-right: -6px; color: var(--sub); }
.search .icon-btn.on { color: var(--accent-hi); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
.filters label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
.filters .input, .filters select { height: 30px; font-size: 13px; padding: 0 8px; width: auto; }
.filters .input[type=text] { width: 130px; }
.filters input[type=checkbox] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.filters .link { font-size: 13px; }
.list-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 8px; }
.list-head h2 { margin: 0; font-size: 17px; }
.list-head .grow { flex: 1; }
.list { flex: 1; overflow: auto; }
.row { display: flex; gap: 10px; padding: 10px 14px 10px 12px; border-bottom: 1px solid #2c3039; cursor: pointer; position: relative; user-select: none; }
.row:hover { background: #282c35; }
.row.sel { background: #2d3442; }
.row .bar { width: 3px; border-radius: 2px; flex: none; align-self: stretch; }
.row .body { flex: 1; min-width: 0; }
.row .top { display: flex; align-items: baseline; gap: 8px; }
.row .from { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sub); }
.row .date { font-size: 12px; color: var(--dim); flex: none; }
.row .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sub); margin-top: 1px; }
.row .snip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 13px; margin-top: 1px; }
.row.unread .from, .row.unread .subj { color: #fff; font-weight: 600; }
.row.unread::before { content: ""; position: absolute; left: 4px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-hi); }
.row .icons { display: flex; gap: 4px; color: var(--dim); align-items: center; }
.row .icons .on { color: var(--star); }
.list-more { padding: 14px; text-align: center; }
.list-msg { padding: 30px 20px; text-align: center; color: var(--sub); line-height: 1.5; }
.acct-errors { margin: 10px 12px 0; padding: 10px 12px; border-radius: 8px; background: #3a2f22; color: #f6d4a1; font-size: 13px; line-height: 1.45; }

/* ---------- reading pane ---------- */
.toolbar { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 57px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent; background: none; color: #dfe3e8; font-weight: 600; }
.tb:hover:not(:disabled) { background: var(--card2); }
.tb.on svg { color: var(--star); fill: var(--star); }
.reader { flex: 1; overflow: auto; padding: 20px 24px 30px; }
.reader h1 { font-size: 20px; margin: 0 0 14px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.hdr { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
.hdr .who { flex: 1; min-width: 0; line-height: 1.45; }
.hdr .who b { font-weight: 600; }
.hdr .who .addr { color: var(--sub); }
.hdr .who .small { font-size: 13px; color: var(--sub); word-break: break-word; }
.hdr .when { font-size: 13px; color: var(--sub); text-align: right; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--card2); color: var(--sub); }
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--card); color: var(--sub); margin-bottom: 12px; font-size: 13px; }
.paper { background: #fff; color: #222; border-radius: 8px; overflow: hidden; }
.dialog.pv { max-width: min(1100px, 96vw); height: 92vh; }
.pv-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #111318; overflow: auto; }
.pv-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pv-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.dlg-head a.btn { text-decoration: none; }
.invite { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: var(--card2); }
.invite .cal { width: 48px; flex: none; text-align: center; border-radius: 8px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
.invite .cal b { display: block; background: var(--bad); color: #fff; font-size: 11px; letter-spacing: .5px; padding: 2px 0; }
.invite .cal span { display: block; font-size: 20px; font-weight: 700; padding: 4px 0 6px; }
.invite .body { flex: 1; min-width: 0; line-height: 1.5; }
.invite .body h4 { margin: 0 0 2px; font-size: 15px; }
.invite .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.invite .acts .btn.small.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.invite .status { color: var(--good); font-weight: 600; }
.invite.cancelled { border-left-color: var(--bad); }
.msgcard { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: var(--card); }
.msgcard .mhead { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; }
.msgcard .mhead:hover { background: var(--card2); }
.msgcard.open .mhead { cursor: default; border-bottom: 1px solid var(--line); }
.msgcard.open .mhead:hover { background: none; }
.msgcard .mhead .who { flex: 1; min-width: 0; line-height: 1.45; }
.msgcard .mhead .who .snip { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgcard .mhead .who .small { font-size: 13px; color: var(--sub); word-break: break-word; }
.msgcard .mhead .when { font-size: 13px; color: var(--sub); text-align: right; flex: none; }
.msgcard .mhead .tb { height: 30px; padding: 0 8px; margin: -4px 0 0 4px; }
.msgcard .mbody { padding: 12px 14px 14px; }
.msgcard .avatar { width: 34px; height: 34px; font-size: 13px; }
.row .chk { width: 18px; display: flex; align-items: center; flex: none; opacity: 0; transition: opacity .1s; }
.row .chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.row:hover .chk, .list.has-checked .chk, .row.checked .chk { opacity: 1; }
.row.checked { background: #2a3550; }
.bulk { display: flex; align-items: center; gap: 4px; padding: 8px 10px 6px 14px; flex-wrap: wrap; }
.bulk .chk input { width: 16px; height: 16px; margin: 0 8px 0 0; accent-color: var(--accent); cursor: pointer; }
.bulk b { margin-right: 6px; }
.bulk .tb { height: 32px; padding: 0 9px; }
.list-head .link { font-size: 13px; }
.row .count { font-size: 11px; font-weight: 600; color: var(--sub); background: var(--card2); border-radius: 9px; padding: 1px 6px; margin-left: 6px; }
.thread-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; }
.thread-head h1 { margin: 0; flex: 1; }
.thread-head .chip { flex: none; }
.paper iframe { width: 100%; border: 0; display: block; min-height: 120px; background: #fff; }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.att { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--text); text-decoration: none; max-width: 280px; }
.att:hover { background: var(--card2); }
.att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att small { color: var(--dim); flex: none; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; color: var(--sub); }
.empty h2 { color: var(--text); font-size: 18px; margin: 14px 0 6px; }
.empty p { margin: 0 0 16px; max-width: 420px; line-height: 1.5; }

/* ---------- buttons, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hi); }
.btn.ghost { background: transparent; }
.btn.danger { color: #ffb4b2; }
.btn.small { height: 30px; padding: 0 12px; font-size: 13px; }
.link { background: none; border: 0; padding: 0; color: var(--accent-hi); font-weight: 600; text-decoration: none; }
.link:hover { text-decoration: underline; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; color: var(--sub); font-weight: 600; }
.input { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 0 10px; outline: none; width: 100%; }
.input:focus { border-color: var(--accent); }
select.input { padding-right: 6px; }
.check { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- compose ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .55); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; max-height: 100%; width: 100%; }
.dialog.compose { max-width: 860px; height: 88vh; }
.dialog.small { max-width: 520px; }
.dialog.wide { max-width: 980px; height: 88vh; }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 16px 18px; overflow: auto; flex: 1; min-height: 0; }
.dlg-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
.dlg-foot .grow { flex: 1; }
.x { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; color: var(--sub); display: grid; place-items: center; }
.x:hover { background: var(--card2); color: #fff; }
.cfield { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); padding: 4px 18px; min-height: 42px; }
.cfield label { width: 56px; color: var(--sub); flex: none; font-size: 13px; }
.cfield input, .cfield select { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 34px; }
.cfield select { background: var(--panel); }
.cfield .extra { display: flex; gap: 10px; flex: none; }
.cfield { position: relative; }
.suggest { position: absolute; left: 60px; right: 18px; top: 100%; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.4); overflow: hidden; }
.suggest div { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.suggest div.on, .suggest div:hover { background: var(--card2); }
.suggest .em { color: var(--sub); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fmt { display: flex; gap: 2px; padding: 6px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fmt button { width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: #d4d9df; font-weight: 700; display: grid; place-items: center; }
.fmt button:hover { background: var(--card2); }
.editor-wrap { flex: 1; min-height: 0; overflow: auto; background: #fff; }
/* Dark mode for mail content: invert, then rotate hues back so colors keep
   their hue. Images get the same filter again, which cancels it out.
   #cdd1da inverts to the panel color. */
.dark-mail .paper, .dark-mail .paper iframe { background: #cdd1da; }
.dark-mail .paper iframe, .dark-mail .editor-wrap, .dark-mail .sig-box .editor { filter: invert(1) hue-rotate(180deg); }
.dark-mail .editor-wrap, .dark-mail .editor { background: #cdd1da; }
.dark-mail .editor img, .dark-mail .editor video { filter: invert(1) hue-rotate(180deg); }
.reader.light-msg .paper, .reader.light-msg .paper iframe { background: #fff; filter: none; }
.editor { min-height: 100%; padding: 16px 20px; color: #222; background: #fff; outline: none; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color-scheme: light; }
.editor blockquote { margin: 0 0 0 .8ex; border-left: 1px solid #ccc; padding-left: 1ex; }
.editor .cm-signature { color: #444; }
.editor .cm-quote { color: #555; }
.sig-editor { min-height: 120px; max-height: 260px; overflow: auto; border-radius: 0 0 8px 8px; padding: 12px 14px; }
.sig-box { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sig-box .fmt { background: var(--card); }
.files { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px 0; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 14px; background: var(--card2); font-size: 13px; max-width: 280px; }
.file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-chip button { border: 0; background: none; color: var(--sub); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.file-chip button:hover { background: var(--hover); color: #fff; }
.err { color: #ffb4b2; font-size: 13px; }

/* ---------- settings ---------- */
.tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 12px 14px; color: var(--sub); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.active { color: #fff; border-bottom-color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.card-row { display: flex; align-items: center; gap: 12px; }
.card-row .grow { flex: 1; min-width: 0; }
.card h4 { margin: 0 0 2px; font-size: 15px; }
.ident { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ident:first-of-type { border-top: 0; }
.ident .grow { flex: 1; min-width: 0; }
.ident .sig-preview { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #1f3a63; color: #a9c8ff; }
.badge.warn { background: #3a2f22; color: var(--warn); }
.steps { line-height: 1.6; color: var(--sub); padding-left: 20px; margin: 6px 0 14px; }
.steps code, .code { background: var(--bg); padding: 1px 6px; border-radius: 4px; color: #dfe3e8; font-family: Consolas, monospace; font-size: 12.5px; user-select: all; }
.color-pick { display: flex; gap: 6px; }
.color-pick button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }
.color-pick button.on { border-color: #fff; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #11141a; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.4); z-index: 30; display: flex; gap: 14px; align-items: center; }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent-hi); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.demo-flag { margin: 0 12px 10px; padding: 8px 10px; border-radius: 8px; background: #3a2f22; color: #f6d4a1; font-size: 12px; line-height: 1.4; }

/* ---------- phones (the Android app) ---------- */
.phone-only { display: none !important; }
@media (max-width: 760px) {
  :root { font-size: 15px; }
  .phone-only { display: inline-flex !important; }
  .desk-only { display: none !important; }
  body { display: block; background: var(--bg); }
  /* The sidebar becomes a drawer. */
  .sidebar { position: fixed; z-index: 25; inset: 0 auto 0 0; width: min(300px, 86vw); background: var(--side); transform: translateX(-102%); transition: transform .2s ease; overflow-y: auto; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  body.drawer .sidebar { transform: none; }
  #scrim { position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.5); }
  body:not(.drawer) #scrim { display: none; }
  .side-spacer { min-height: 16px; }
  main { margin: 0; border-radius: 0; height: 100%; }
  .list-pane { width: 100%; border-right: 0; }
  .read-pane { display: none; }
  body.reading .list-pane { display: none; }
  body.reading .read-pane { display: flex; width: 100%; }
  .searchbar { padding: 10px 10px 10px 6px; gap: 4px; align-items: center; }
  .icon-btn { width: 42px; height: 42px; border: 0; background: none; color: var(--text); border-radius: 10px; display: grid; place-items: center; flex: none; }
  .icon-btn:active { background: var(--card2); }
  .search { height: 42px; border-radius: 21px; }
  .row { padding: 12px 14px 12px 12px; }
  .row .chk { opacity: 1; }
  .list { padding-bottom: 90px; }
  #fab { position: fixed; right: 18px; bottom: 18px; z-index: 5; height: 54px; padding: 0 20px; border-radius: 16px; border: 0; background: var(--accent); color: #fff; font-weight: 600; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  body.reading #fab { display: none !important; }
  .toolbar { padding: 6px 8px; gap: 0; min-height: 54px; flex-wrap: nowrap; }
  .toolbar .tb { padding: 0 9px; height: 42px; }
  .reader { padding: 14px 14px 30px; }
  .reader h1 { font-size: 19px; }
  .hdr .when { display: none; }
  .reply-bar { display: flex; gap: 8px; margin-top: 18px; }
  .reply-bar .btn { flex: 1; height: 44px; padding: 0 8px; }
  .att { max-width: 100%; }
  .toast { left: 16px; right: 16px; transform: none; bottom: 84px; }
  /* Dialogs fill the screen. */
  .overlay { padding: 0; }
  .dialog, .dialog.compose, .dialog.wide, .dialog.small { max-width: none; height: 100%; max-height: none; border-radius: 0; border: 0; }
  .dialog.small { height: auto; margin: auto 16px; border-radius: 12px; border: 1px solid var(--line); }

  .card-row .grow { flex-basis: calc(100% - 30px); }
  .card-row .grow .muted { overflow-wrap: anywhere; }
  .ident { flex-wrap: wrap; }
  .id-grid { grid-template-columns: 1fr !important; }
  .input { height: 42px; font-size: 16px; }
}

const TOKEN = location.hash.slice(1);

async function api(path, body) {
  const opt = { headers: { "X-Echo-Token": TOKEN } };
  if (body !== undefined) {
    opt.method = "POST";
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
const dl = (path, params) => path + "?" + new URLSearchParams({ ...params, t: TOKEN });

const ICON = {

// ask shows a small in-app question and resolves with true for the main
// button. The browser's own confirm() would show the app's local address.
function ask(text, { ok = "OK", cancel = "Cancel", danger = false, input = null } = {}) {
  return new Promise(resolve => {
    const box = document.createElement("div");
    box.innerHTML = `<div class="overlay"><div class="dialog small">
      <div class="dlg-body" style="padding:20px 18px 6px;line-height:1.5">${esc(text)}${input !== null ? `<input class="input" id="askInput" style="margin-top:12px" value="${esc(input)}" spellcheck="false">` : ""}</div>
      <div class="dlg-foot" style="border-top:0"><span class="grow"></span>
        <button class="btn ghost" data-x>${esc(cancel)}</button><button class="btn ${danger ? "" : "primary"} ${danger ? "danger" : ""}" id="askOk">${esc(ok)}</button></div></div></div>`;
    $("#modal").append(box);
    const done = v => { box.remove(); resolve(v); };
    box.querySelector("[data-x]").onclick = () => done(input !== null ? null : false);
    box.querySelector("#askOk").onclick = () => done(input !== null ? box.querySelector("#askInput").value.trim() : true);
    box.querySelector(".dialog").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); box.querySelector("#askOk").click(); } });
    (box.querySelector("#askInput") || box.querySelector("#askOk")).focus();
  });
}

function toast(text, ms = 3500, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(text)}</span>`;
  if (action) {
    const b = document.createElement("button");
    b.className = "link"; b.textContent = action.label; b.onclick = () => { t.hidden = true; action.run(); };
    t.append(b);
  }
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), ms);
}

function fmtDate(iso, long) {
  const d = new Date(iso), now = new Date();
  if (long) return d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const days = (now - d) / 864e5;
  if (days < 6) return d.toLocaleDateString([], { weekday: "short" });
  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString([], { month: "short", day: "numeric" });
  return d.toLocaleDateString();
}
const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";
const addrText = a => a ? (a.name ? `${a.name} <${a.email}>` : a.email) : "";
const addrList = l => (l || []).map(addrText).join(", ");
const initials = a => ((a.name || a.email || "?").replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("") || "?").toUpperCase();
function hue(s) { let h = 0; for (const c of s || "") h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 45% 42%)`; }

/* ---------- list ---------- */
async function loadList(more) {
  const req = { folder: S.query ? "all" : S.folder, query: S.query, accountId: S.account, group: true };
  if (more) req.cursors = S.cursors;
  const ticket = loadList.ticket = (loadList.ticket || 0) + 1;
  S.loading = true;
  if (!more) { S.messages = []; S.errors = {}; }
  renderSidebar(); renderList();
  try {
    const r = await api("/api/list", req);
    if (ticket !== loadList.ticket) return;
    const seen = new Set(S.messages.map(rowKey));
    S.messages = S.messages.concat(r.messages.filter(m => !seen.has(rowKey(m))));
    S.messages.sort((a, b) => new Date(b.date) - new Date(a.date));
    S.cursors = r.cursors; S.errors = r.errors;
  } catch (e) {
    if (ticket !== loadList.ticket) return;
    S.errors = { "": e.message };
  }
  S.loading = false;
  if (Object.keys(S.errors).length) refreshState();
  renderList();
}

function renderList() {
  // Drop ticks for rows that are gone.
  const keys = new Set(S.messages.map(rowKey));
  for (const k of S.checked) if (!keys.has(k)) S.checked.delete(k);
  const acct = acctById(S.account);
  const head = $("#listHead");
  if (S.checked.size) {
    const inTrash = S.folder === "trash" && !S.query, inSpam = S.folder === "spam" && !S.query;
    head.className = "bulk";
    head.innerHTML = `<label class="chk"><input type="checkbox" id="chkAll" ${S.checked.size === S.messages.length ? "checked" : ""} title="Select all"></label>
      <b>${S.checked.size} selected</b>
      ${inTrash || inSpam ? `<button class="tb" data-bulk="inbox" title="Move to Inbox">${icon("inbox", 16)}Inbox</button>` : `<button class="tb" data-bulk="archive" title="Archive">${icon("archive", 16)}Archive</button>`}
      ${inTrash ? "" : `<button class="tb" data-bulk="trash" title="Delete">${icon("trash", 16)}</button>`}
      ${inSpam || inTrash ? "" : `<button class="tb" data-bulk="spam" title="Report spam">${icon("spam", 16)}</button>`}
      <button class="tb" data-bulk="read" title="Mark read">${icon("unread", 16)}Read</button>
      <button class="tb" data-bulk="unread" title="Mark unread">Unread</button>
      <button class="tb" data-bulk="star" title="Star">${icon("starred", 16)}</button>
      <span class="grow"></span><button class="tb" data-bulk="clear" title="Clear selection">${icon("x", 16)}</button>`;
  } else {
    head.className = "list-head";
    const unread = S.messages.filter(m => m.unread).length;
    head.innerHTML = `<h2 id="listTitle">${esc(S.query ? "Search results" : FOLDER_NAMES[S.folder])}</h2><span class="dim" id="listSub">${esc(acct ? acct.name || acct.email : S.accounts.length > 1 ? "All accounts" : "")}</span>
      <span class="grow"></span>${unread && !S.query ? `<button class="link" data-bulk="allread" title="Mark every message shown as read">Mark all read</button>` : ""}`;
  }
  const errs = Object.entries(S.errors);
  $("#acctErrors").innerHTML = errs.length ? `<div class="acct-errors">${errs.map(([id, e]) => {
    const a = acctById(id);
    return `<div><b>${esc(a ? a.name || a.email : "Error")}:</b> ${esc(e)}</div>`;
  }).join("")}${errs.some(([id]) => acctById(id)?.needsReconnect) ? '<div style="margin-top:6px"><button class="link" data-go="accounts">Reconnect in Settings</button></div>' : ""}</div>` : "";

  const list = $("#list");
  if (!S.accounts.length) {
    list.innerHTML = `<div class="list-msg">No accounts yet.<br><button class="btn primary" style="margin-top:14px" data-go="accounts">Add an account</button></div>`;
    return;
  }
  if (!S.messages.length) {
    list.innerHTML = S.loading ? `<div class="list-msg"><div class="spin" style="margin:0 auto"></div></div>` :
      `<div class="list-msg">${S.query ? "Nothing matched your search." : "Nothing in " + FOLDER_NAMES[S.folder] + "."}</div>`;
    return;
  }
  const multi = S.accounts.length > 1;
  list.classList.toggle("has-checked", S.checked.size > 0);
  list.innerHTML = S.messages.map((m, i) => {
    const a = acctById(m.accountId) || {};
    const who = m.draftId ? "Draft" + ((m.to || []).length ? " to " + m.to.map(t => t.name || t.email).join(", ") : "")
      : S.folder === "sent" && !S.query ? "To: " + ((m.to || []).map(t => t.name || t.email).join(", ") || "(no recipients)") : (m.participants || [m.from.name || m.from.email]).join(", ");
    const sel = S.sel && S.sel.key === rowKey(m), checked = S.checked.has(rowKey(m));
    return `<div class="row ${m.unread ? "unread" : ""} ${sel ? "sel" : ""} ${checked ? "checked" : ""}" data-i="${i}">
      <label class="chk" title="Select"><input type="checkbox" data-chk="${i}" ${checked ? "checked" : ""}></label>
      ${multi ? `<span class="bar" style="background:${esc(a.color)}" title="${esc(a.email)}"></span>` : ""}
      <div class="body">
        <div class="top"><span class="from">${esc(who)}${m.count > 1 ? `<span class="count">${m.count}</span>` : ""}</span>
          <span class="icons">${m.hasAttachments ? icon("clip", 13) : ""}${m.starred ? icon("starred", 13, 'class="on" fill="currentColor"') : ""}</span>
          <span class="date">${esc(fmtDate(m.date))}</span></div>
        <div class="subj">${esc(m.subject || "(no subject)")}</div>
        <div class="snip">${esc(m.snippet)}</div>
      </div></div>`;
  }).join("") + (Object.keys(S.cursors || {}).length ? `<div class="list-more"><button class="btn small" id="moreBtn" ${S.loading ? "disabled" : ""}>${S.loading ? "Loading..." : "Load more"}</button></div>` : "");
}
let lastChk = -1;
$("#list").onclick = e => {
  if (e.target.id === "moreBtn") return loadList(true);
  const chk = e.target.closest("[data-chk]");
  if (chk) {
    const i = +chk.dataset.chk;
    // Shift-click ticks the whole range from the last tick.
    const from = e.shiftKey && lastChk >= 0 ? Math.min(lastChk, i) : i, to = e.shiftKey && lastChk >= 0 ? Math.max(lastChk, i) : i;
    for (let j = from; j <= to; j++) { const k = rowKey(S.messages[j]); if (chk.checked) S.checked.add(k); else S.checked.delete(k); }
    lastChk = i;
    renderList();
    return;
  }
  if (e.target.closest(".chk")) return;
  const row = e.target.closest(".row");
  if (!row) return;
  const m = S.messages[+row.dataset.i];
  if (m.draftId) openDraft(m); else openMessage(m);
};
$(".list-pane").addEventListener("click", e => {
  if (e.target.id === "chkAll") {
    if (e.target.checked) S.messages.forEach(m => S.checked.add(rowKey(m))); else S.checked.clear();
    return renderList();
  }
  const b = e.target.closest("[data-bulk]");
  if (b) bulk(b.dataset.bulk);
});

// bulk applies a change to the ticked rows, or to every unread row shown
// for "allread". Rows are grouped by account because each account is its
// own mailbox.
async function bulk(kind) {
  if (kind === "clear") { S.checked.clear(); return renderList(); }
  const rows = kind === "allread" ? S.messages.filter(m => m.unread) : S.messages.filter(m => S.checked.has(rowKey(m)));
  if (!rows.length) return;
  const change = kind === "allread" ? "read" : kind;
  const move = ["archive", "trash", "spam", "inbox"].includes(change);
  const groups = {};
  for (const m of rows) {
    const g = groups[m.accountId] = groups[m.accountId] || { threads: [], ids: [], drafts: [] };
    if (m.draftId) g.drafts.push(m.draftId); else if (m.threadId) g.threads.push(m.threadId); else g.ids.push(m.id);
  }
  const calls = [];
  for (const [accountId, g] of Object.entries(groups)) {
    if (g.threads.length || g.ids.length) calls.push(api("/api/apply", { accountId, threads: g.threads, ids: g.ids, change }));
    // A draft can only be deleted; other changes don't apply to it.
    if (change === "trash") g.drafts.forEach(d => calls.push(api("/api/draft/delete", { accountId, draftId: d })));
  }
  try { await Promise.all(calls); } catch (e) { toast(e.message, 6000); loadList(); return; }
  const keys = new Set(rows.map(rowKey));
  if (move) {
    if (S.sel && keys.has(S.sel.key)) { S.sel = null; S.msg = null; closeReader(); renderEmptyReader(); }
    S.messages = S.messages.filter(m => !keys.has(rowKey(m)));
  } else {
    for (const m of rows) {
      if (change === "read") m.unread = false;
      if (change === "unread") m.unread = true;
      if (change === "star") m.starred = true;
    }
  }
  S.checked.clear();
  renderList();
  pollUnread();
  const n = rows.length, what = n === 1 ? "1 conversation" : n + " conversations";
  const label = { archive: "Archived", trash: "Deleted", spam: "Reported as spam", inbox: "Moved to Inbox", read: "Marked read", unread: "Marked unread", star: "Starred" }[change];
  const undo = { archive: "inbox", trash: "inbox", spam: "inbox" }[change];
  toast(`${label} ${what}`, 5000, undo && {
    label: "Undo", run: async () => {
      try {
        await Promise.all(Object.entries(groups).map(([accountId, g]) => (g.threads.length || g.ids.length) && api("/api/apply", { accountId, threads: g.threads, ids: g.ids, change: undo })));
        loadList(); pollUnread();
      } catch (e) { toast(e.message); }
    }
  });
}

// openDraft reopens a saved draft in the compose window.
async function openDraft(m) {
  try {
    const full = await api(dl("/api/message", { a: m.accountId, id: m.id }));
    const from = S.identities.find(i => i.accountId === m.accountId && SameEmail(i.email, full.from.email)) ||
      S.identities.find(i => i.accountId === m.accountId && i.default) || S.identities.find(i => i.accountId === m.accountId);
    compose({
      identityId: from && from.id, to: full.to, cc: full.cc, bcc: full.bcc, subject: full.subject, html: full.html,
      inReplyTo: full.inReplyTo, references: full.references, threadId: full.threadId, replyAccountId: m.accountId,
      kind: full.inReplyTo ? "reply" : "",
      attachments: (full.attachments || []).filter(a => !a.inline), forwardFrom: { accountId: m.accountId, msgId: m.id },
      draft: { id: m.draftId, accountId: m.accountId },
    });
  } catch (e) { toast(e.message, 6000); }
}
const SameEmail = (a, b) => (a || "").trim().toLowerCase() === (b || "").trim().toLowerCase();
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) openSettings(go.dataset.go);
});

let searchTimer;
$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter") { clearTimeout(searchTimer); S.query = e.target.value.trim(); loadList(); }
  if (e.key === "Escape") { e.target.value = ""; if (S.query) { S.query = ""; loadList(); } e.target.blur(); }
});
$("#search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const q = e.target.value.trim(); if (q !== S.query) { S.query = q; loadList(); } }, 600);
});
$("#refreshBtn").onclick = () => { loadList(); pollUnread(); };

/* ---------- search filters ---------- */
// The filters build the same operators you can type: from:, to:, subject:,
// has:attachment, after:, before:. The box shows the result so the syntax
// is easy to pick up.
$("#filterBtn").onclick = () => {
  const f = $("#filters");
  f.hidden = !f.hidden;
  $("#filterBtn").classList.toggle("on", !f.hidden);
  if (!f.hidden) { fillAcctFilter(); $("#fFrom").focus(); }
};
function fillAcctFilter() {
  $("#fAcct").innerHTML = `<option value="">All</option>` + S.accounts.map(a => `<option value="${esc(a.id)}" ${S.account === a.id ? "selected" : ""}>${esc(a.name || a.email)}</option>`).join("");
}
const day = d => d.toISOString().slice(0, 10);
function applyFilters() {
  // Keep the free text the user typed; replace the operator parts.
  const text = $("#search").value.split(/\s+/).filter(t => !/^(from|to|subject|has|after|before):/i.test(t)).join(" ").trim();
  const parts = [];
  if (text) parts.push(text);
  const q = v => /\s/.test(v) ? `"${v}"` : v;
  if ($("#fFrom").value.trim()) parts.push("from:" + q($("#fFrom").value.trim()));
  if ($("#fTo").value.trim()) parts.push("to:" + q($("#fTo").value.trim()));
  if ($("#fSubject").value.trim()) parts.push("subject:" + q($("#fSubject").value.trim()));
  if ($("#fAtt").checked) parts.push("has:attachment");
  const d = $("#fDate").value;
  $("#fRange").hidden = d !== "custom";
  if (d && d !== "custom") { const t = new Date(); t.setDate(t.getDate() - (+d - 1)); parts.push("after:" + day(t)); }
  if (d === "custom") {
    if ($("#fAfter").value) parts.push("after:" + $("#fAfter").value);
    if ($("#fBefore").value) { const t = new Date($("#fBefore").value); t.setDate(t.getDate() + 1); parts.push("before:" + day(t)); }
  }
  $("#search").value = parts.join(" ");
  S.account = $("#fAcct").value;
  S.query = $("#search").value.trim();
  renderSidebar();
  loadList();
}
let filterTimer;
$("#filters").addEventListener("input", e => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyFilters, e.target.type === "text" ? 500 : 0);
});
$("#fClear").onclick = () => {
  ["fFrom", "fTo", "fSubject", "fAfter", "fBefore"].forEach(id => ($("#" + id).value = ""));
  $("#fAtt").checked = false; $("#fDate").value = ""; $("#fAcct").value = ""; $("#fRange").hidden = true;
  $("#search").value = ""; S.query = ""; S.account = ""; renderSidebar(); loadList();
};

/* ---------- reading pane ---------- */
function renderEmptyReader() {
  $("#readPane").innerHTML = S.accounts.length ? `<div class="empty">${icon("unread", 48, 'class="dim"')}<h2>No message selected</h2><p>Pick a message on the left. Press C to write a new one.</p></div>` :
    `<div class="empty">${icon("inbox", 48, 'class="dim"')}<h2>Welcome to Project Echo Mike</h2>
     <p>Connect your Gmail and Outlook accounts to see all of your mail in one place and send from any of your aliases.</p>
     <button class="btn primary" data-go="accounts">Add an account</button></div>`;
}

// rowKey identifies a list row: a conversation, or a lone message.
const rowKey = m => m.accountId + "/" + (m.threadId || "msg:" + m.id);

// openMessage opens the conversation a row stands for. S.thread holds its
// messages oldest first, S.msg the newest one (what the toolbar acts on),
// and S.open the ids shown expanded.
async function openMessage(m) {
  if (!m) return;
  const key = rowKey(m);
  S.sel = { accountId: m.accountId, key, threadId: m.threadId || "" };
  document.body.classList.add("reading");
  S.showImages = !!S.settings.loadImages;
  S.lightMsg = false;
  renderList();
  $("#readPane").innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  try {
    let msgs;
    if (m.threadId) {
      msgs = await api(dl("/api/thread", { a: m.accountId, id: m.threadId }));
    } else {
      msgs = [await api(dl("/api/message", { a: m.accountId, id: m.id }))];
    }
    if (!S.sel || S.sel.key !== key) return;
    // Trashed or spam messages in the conversation stay out of the way
    // unless that's the folder being looked at.
    const inBin = (S.folder === "trash" || S.folder === "spam") && !S.query;
    const shown = inBin ? msgs : msgs.filter(x => !x.hidden);
    S.thread = shown.length ? shown : msgs;
    S.msg = S.thread[S.thread.length - 1];
    S.open = new Set(S.thread.filter(x => x.unread || x === S.msg).map(x => x.id));
    renderReader();
    const unread = S.thread.filter(x => x.unread);
    if (unread.length || m.unread) {
      m.unread = false; unread.forEach(x => (x.unread = false)); renderList();
      api("/api/apply", { accountId: m.accountId, ids: unread.map(x => x.id), change: "read" }).then(pollUnread).catch(() => {});
    }
  } catch (e) {
    $("#readPane").innerHTML = `<div class="empty"><h2>Couldn't open that conversation</h2><p>${esc(e.message)}</p></div>`;
  }
}

function renderReader() {
  const m = S.msg, a = acctById(m.accountId) || {};
  const inTrash = S.folder === "trash" && !S.query, inSpam = S.folder === "spam" && !S.query;
  const many = S.thread.length > 1;
  $("#readPane").innerHTML = `
    <div class="toolbar">
      <button class="tb phone-only" data-act="back" title="Back" aria-label="Back">${icon("back", 22)}</button>
      <button class="tb desk-only" data-act="reply" title="Reply (R)">${icon("reply")}Reply</button>
      <button class="tb desk-only" data-act="replyAll" title="Reply all (A)">${icon("replyAll")}Reply all</button>
      <button class="tb desk-only" data-act="forward" title="Forward (F)">${icon("forward")}Forward</button>
      <span class="grow"></span>
      ${inTrash || inSpam ? `<button class="tb" data-act="inbox" title="Move to Inbox">${icon("inbox")}Not ${inSpam ? "spam" : "deleted"}</button>` :
        `<button class="tb" data-act="archive" title="Archive (E)">${icon("archive")}Archive</button>`}
      ${inSpam ? "" : `<button class="tb" data-act="spam" title="Report spam">${icon("spam")}</button>`}
      ${inTrash ? "" : `<button class="tb" data-act="trash" title="Delete (Del)">${icon("trash")}</button>`}
      <button class="tb" data-act="unread" title="Mark unread (U)">${icon("unread")}</button>
      ${S.settings.lightMessages ? "" : `<button class="tb ${S.lightMsg ? "on-light" : ""}" data-act="light" title="${S.lightMsg ? "Show this conversation dark" : "Show this conversation on white, for emails that look wrong in dark"}">${icon(S.lightMsg ? "moon" : "sun")}</button>`}
      <button class="tb ${m.starred ? "on" : ""}" data-act="star" title="${m.starred ? "Unstar" : "Star"} (S)">${icon("starred")}</button>
    </div>
    <div class="reader ${S.lightMsg ? "light-msg" : ""}">
      <div class="thread-head"><h1>${esc(m.subject || "(no subject)")}</h1>
        <span class="chip"><span class="acct-dot" style="background:${esc(a.color)};width:8px;height:8px"></span>${esc(a.name || a.email || "")}${many ? ` · ${S.thread.length} messages` : ""}</span></div>
      ${S.thread.map((x, i) => msgCard(x, i, S.open.has(x.id))).join("")}
      <div class="reply-bar phone-only">
        <button class="btn" data-act="reply">${icon("reply", 16)}Reply</button>
        <button class="btn" data-act="replyAll">${icon("replyAll", 16)}All</button>
        <button class="btn" data-act="forward">${icon("forward", 16)}Forward</button>
      </div>
    </div>`;
  S.thread.forEach((x, i) => { if (S.open.has(x.id)) renderBody(x, i); });
}

function msgCard(x, i, open) {
  const files = (x.attachments || []).filter(f => !f.inline || !(x.html || "").includes("cid:" + f.contentId));
  return `<div class="msgcard ${open ? "open" : ""}" data-i="${i}">
    <div class="mhead" data-expand="${i}">
      <div class="avatar" style="background:${hue(x.from.email)}">${esc(initials(x.from))}</div>
      <div class="who">
        <div><b>${esc(x.from.name || x.from.email)}</b> ${open && x.from.name ? `<span class="addr">&lt;${esc(x.from.email)}&gt;</span>` : ""}</div>
        ${open ? `<div class="small">To: ${esc(addrList(x.to)) || "(undisclosed)"}${x.cc && x.cc.length ? "<br>Cc: " + esc(addrList(x.cc)) : ""}</div>`
               : `<div class="snip">${esc(x.snippet || "")}</div>`}
      </div>
      <div class="when">${esc(fmtDate(x.date, open))}</div>
      ${open && S.thread.length > 1 ? `<button class="tb" data-reply-one="${i}" title="Reply to this message">${icon("reply", 16)}</button>` : ""}
    </div>
    ${open ? `<div class="mbody">
      ${x.invite ? inviteCard(x, i) : ""}
      <div class="imgBanner" data-banner="${i}"></div>
      <div class="paper"><iframe id="frame-${i}" sandbox="allow-same-origin" referrerpolicy="no-referrer" title="Message"></iframe></div>
      ${files.length ? `<div class="atts">${files.map((f, j) => `<a class="att" href="${esc(dl("/api/attachment", { a: x.accountId, m: x.id, att: f.id, name: f.name, type: f.mimeType }))}" ${canPreview(f) ? `data-preview="${i}:${j}"` : ""} title="${canPreview(f) ? "Open" : "Download"} ${esc(f.name)}">${icon(canPreview(f) ? (f.mimeType === "application/pdf" ? "pdf" : "image") : "clip", 15)}<span>${esc(f.name)}</span><small>${fmtSize(f.size)}</small></a>`).join("")}</div>` : ""}
    </div>` : ""}
  </div>`;
}

// renderBody writes the message into a sandboxed frame. Scripts never run
// there. Links go to /open so they open in your browser, cid: images come
// from the attachment endpoint, and remote images stay blocked until you ask,
// so tracking pixels can't report that you read it.
function renderBody(m, i) {
  const dark = !S.settings.lightMessages && !S.lightMsg;
  const doc = new DOMParser().parseFromString(m.html || `<div style="white-space:pre-wrap;font-family:inherit">${esc(m.text || "")}</div>`, "text/html");
  doc.querySelectorAll("script,iframe,frame,frameset,object,embed,base,meta,link[rel=import],form button[type=submit]").forEach(n => n.remove());
  doc.querySelectorAll("a[href],area[href]").forEach(n => {
    const href = n.getAttribute("href").trim();
    n.removeAttribute("target");
    if (/^(https?:|mailto:)/i.test(href)) { n.setAttribute("href", dl(ORIGIN + "/open", { u: href })); n.setAttribute("title", href); }
    else if (!href.startsWith("#")) n.removeAttribute("href");
  });
  const byCid = {};
  (m.attachments || []).forEach(x => { if (x.contentId) byCid[x.contentId.replace(/^<|>$/g, "")] = x; });
  let remote = 0;
  doc.querySelectorAll("img").forEach(img => {
    const src = (img.getAttribute("src") || "").trim();
    if (/^cid:/i.test(src)) {
      const x = byCid[decodeURIComponent(src.slice(4))];
      if (x) img.setAttribute("src", dl(ORIGIN + "/api/attachment", { a: m.accountId, m: m.id, att: x.id, name: x.name, type: x.mimeType, inline: "1" }));
    } else if (/^(https?:)?\/\//i.test(src)) remote++;
  });
  if (/url\(\s*['"]?(https?:)?\/\//i.test(m.html || "")) remote++;
  const imgSrc = S.showImages ? "img-src data: https: http: " + ORIGIN : "img-src data: " + ORIGIN;
  const csp = `default-src 'none'; style-src 'unsafe-inline'; font-src data:${S.showImages ? " https:" : ""}; ${imgSrc}`;
  const head = doc.head || doc.documentElement.insertBefore(doc.createElement("head"), doc.body);
  head.insertAdjacentHTML("afterbegin", `<meta http-equiv="Content-Security-Policy" content="${csp}"><base target="_self">
    <style>html,body{margin:0}${dark ? "html{background:#cdd1da}img,video,picture{filter:invert(1) hue-rotate(180deg)}" : ""}body{padding:18px 20px;font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#222;word-wrap:break-word;color-scheme:light}img{max-width:100%;height:auto}blockquote{margin:0 0 0 .8ex;border-left:1px solid #ccc;padding-left:1ex}pre{white-space:pre-wrap}</style>`);
  const f = $("#frame-" + i);
  if (!f) return;
  f.onload = () => {
    const d = f.contentDocument;
    if (!d) return;
    const fit = () => { f.style.height = Math.max(120, d.documentElement.scrollHeight) + "px"; };
    fit();
    new ResizeObserver(fit).observe(d.body);
    d.querySelectorAll("img").forEach(i => i.addEventListener("load", fit));
  };
  f.srcdoc = "<!doctype html>" + doc.documentElement.outerHTML;
  $(`[data-banner="${i}"]`).innerHTML = remote && !S.showImages ? `<div class="banner">${icon("spam", 16)}<span>Remote images are hidden so the sender can't tell you opened this.</span><button class="link" data-show-imgs>Show images</button></div>` : "";
}
// inviteCard shows a calendar invitation with Accept, Tentative and
// Decline. Answering replies to the organizer as the alias it came to.
function inviteCard(x, i) {
  const v = x.invite, cancelled = v.method === "CANCEL";
  const s = new Date(v.start), e = new Date(v.end);
  const day = s.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  const when = v.allDay ? day + " (all day)" : `${day}, ${s.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} to ${e.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
  const mine = (v.myStatus || "").toUpperCase();
  const label = { ACCEPTED: "You accepted", TENTATIVE: "You tentatively accepted", DECLINED: "You declined" }[mine];
  const btn = (st, text) => `<button class="btn small ${mine === st ? "on" : ""}" data-rsvp="${i}:${st}">${text}</button>`;
  return `<div class="invite ${cancelled ? "cancelled" : ""}">
    <div class="cal"><b>${esc(s.toLocaleDateString([], { month: "short" }).toUpperCase())}</b><span>${s.getDate()}</span></div>
    <div class="body">
      <h4>${esc(v.summary || x.subject)}</h4>
      <div>${esc(when)}</div>
      ${v.location ? `<div class="muted">${esc(v.location)}</div>` : ""}
      <div class="muted">Organized by ${esc(v.organizer.name || v.organizer.email)}${v.attendees && v.attendees.length ? ` · ${v.attendees.length} invited` : ""}</div>
      ${cancelled ? `<div class="status" style="color:var(--bad)">This meeting was cancelled.</div>` :
        `<div class="acts">${btn("ACCEPTED", "Accept")}${btn("TENTATIVE", "Maybe")}${btn("DECLINED", "Decline")}${label ? `<span class="status">${label}</span>` : ""}</div>`}
    </div></div>`;
}
async function rsvp(i, status) {
  const x = S.thread[i];
  const btns = $$(`[data-rsvp^="${i}:"]`);
  btns.forEach(b => (b.disabled = true));
  try {
    const r = await api("/api/invite/respond", { accountId: x.accountId, id: x.id, status });
    x.invite.myStatus = r.status;
    renderReader();
    toast(`Reply sent to the organizer from ${r.as}`);
  } catch (e) { toast(e.message, 7000); btns.forEach(b => (b.disabled = false)); }
}
const $$ = s => [...document.querySelectorAll(s)];

// canPreview says whether an attachment opens inside the app.
// Android's WebView can't show PDFs, so there they open in the phone's
// own viewer instead.
const ANDROID = /Android/.test(navigator.userAgent);
const canPreview = f => (/^image\//.test(f.mimeType) && f.mimeType !== "image/svg+xml") || (f.mimeType === "application/pdf" && !ANDROID);

// previewAttachment shows an image or PDF in an overlay, with a download
// button. The file is served with a strict policy so a PDF can't run
// anything, and it's shown in a sandboxed frame.
function previewAttachment(x, f) {
  const view = dl("/api/attachment", { a: x.accountId, m: x.id, att: f.id, name: f.name, type: f.mimeType, inline: "1" });
  const save = dl("/api/attachment", { a: x.accountId, m: x.id, att: f.id, name: f.name, type: f.mimeType });
  const isPdf = f.mimeType === "application/pdf";
  const box = document.createElement("div");
  box.innerHTML = `<div class="overlay preview"><div class="dialog pv">
    <div class="dlg-head"><h3>${esc(f.name)} <span class="dim" style="font-weight:400">${fmtSize(f.size)}</span></h3>
      <a class="btn small" href="${esc(save)}" title="Save to Downloads">${icon("download", 15)}Download</a>
      <button class="x" data-x title="Close">${icon("x")}</button></div>
    <div class="pv-body">${isPdf
      ? `<iframe src="${esc(view)}" title="${esc(f.name)}"></iframe>`
      : `<img src="${esc(view)}" alt="${esc(f.name)}">`}</div></div></div>`;
  $("#modal").append(box);
  box.querySelector("[data-x]").onclick = () => box.remove();
  box.querySelector(".overlay").addEventListener("click", e => { if (e.target === e.currentTarget) box.remove(); });
}

$("#readPane").addEventListener("click", e => {
  const rs = e.target.closest("[data-rsvp]");
  if (rs) { const [i, st] = rs.dataset.rsvp.split(":"); return rsvp(+i, st); }
  const pv = e.target.closest("[data-preview]");
  if (pv) {
    e.preventDefault();
    const [i, j] = pv.dataset.preview.split(":").map(Number);
    const x = S.thread[i];
    const files = (x.attachments || []).filter(f => !f.inline || !(x.html || "").includes("cid:" + f.contentId));
    return previewAttachment(x, files[j]);
  }
  if (e.target.closest("[data-show-imgs]")) { S.showImages = true; S.thread.forEach((x, i) => { if (S.open.has(x.id)) renderBody(x, i); }); return; }
  const one = e.target.closest("[data-reply-one]");
  if (one) { e.stopPropagation(); return replyTo(S.thread[+one.dataset.replyOne], "reply"); }
  const b = e.target.closest("[data-act]");
  if (b) return act(b.dataset.act);
  const h = e.target.closest("[data-expand]");
  if (h && !e.target.closest("a")) {
    const x = S.thread[+h.dataset.expand];
    if (S.open.has(x.id) && S.thread.length > 1) S.open.delete(x.id); else S.open.add(x.id);
    renderReader();
  }
});

async function act(kind) {
  const m = S.msg;
  if (!m) return;
  if (kind === "reply" || kind === "replyAll" || kind === "forward") return replyTo(m, kind);
  if (kind === "light") { S.lightMsg = !S.lightMsg; return renderReader(); }
  if (kind === "back") return closeReader();
  const summary = S.messages.find(x => rowKey(x) === S.sel.key);
  let change = kind;
  if (kind === "star") change = m.starred ? "unstar" : "star";
  // Star and unread apply to the newest message; moves apply to the whole
  // conversation.
  const target = (change === "star" || change === "unstar" || change === "unread" || !S.sel.threadId)
    ? { ids: [m.id] } : { threads: [S.sel.threadId] };
  try {
    await api("/api/apply", { accountId: m.accountId, ...target, change });
  } catch (e) { return toast(e.message, 6000); }
  if (change === "star" || change === "unstar") {
    m.starred = change === "star";
    if (summary) summary.starred = m.starred;
    if (S.folder === "starred" && !m.starred) removeFromList(m); else { renderList(); renderReader(); }
    return;
  }
  if (change === "unread") {
    if (summary) summary.unread = true;
    S.sel = null; S.msg = null; renderList(); renderEmptyReader(); pollUnread();
    return;
  }
  const label = { archive: "Archived", trash: "Moved to Trash", spam: "Reported as spam", inbox: "Moved to Inbox" }[change];
  removeFromList(m);
  pollUnread();
  const undo = { archive: "inbox", trash: "inbox", spam: "inbox" }[change];
  toast(label, 5000, undo && {
    label: "Undo", run: async () => {
      try { await api("/api/apply", { accountId: m.accountId, ...target, change: undo }); loadList(); pollUnread(); } catch (e) { toast(e.message); }
    }
  });
}

function removeFromList(m) {
  const i = S.messages.findIndex(x => rowKey(x) === (S.sel ? S.sel.key : rowKey(m)));
  if (i >= 0) S.messages.splice(i, 1);
  const next = S.messages[Math.min(i, S.messages.length - 1)];
  S.sel = null; S.msg = null;
  renderList();
  // On a phone, go back to the list like other mail apps do.
  if (next && i >= 0 && !PHONE.matches) openMessage(next); else { closeReader(); renderEmptyReader(); }
}

const PHONE = matchMedia("(max-width: 760px)");
function closeReader() { document.body.classList.remove("reading"); }
function setDrawer(open) { document.body.classList.toggle("drawer", open); }
$("#menuBtn").onclick = () => setDrawer(true);
$("#scrim").onclick = () => setDrawer(false);
$("#fab").onclick = () => compose();

// The Android back button: close whatever is on top. Returns false when
// there's nothing left to close, so the app can go to the background.
window.onBack = () => {
  const top = [...document.querySelectorAll("#modal .overlay")].pop();
  if (top) {
    const btn = top.querySelector("[data-x]") || top.querySelector("[data-close]");
    if (btn) btn.click(); else top.parentElement.remove();
    return true;
  }
  if (document.body.classList.contains("drawer")) { setDrawer(false); return true; }
  if (document.body.classList.contains("reading")) { closeReader(); return true; }
  if (S.query) { $("#search").value = ""; S.query = ""; loadList(); return true; }
  if (S.folder !== "inbox" || S.account) { S.folder = "inbox"; S.account = ""; loadList(); return true; }
  return false;
};

/* ---------- compose ---------- */
const FMT = [
  ["bold", "<b>B</b>", "Bold (Ctrl+B)"], ["italic", "<i>I</i>", "Italic (Ctrl+I)"], ["underline", "<u>U</u>", "Underline (Ctrl+U)"],
  ["insertUnorderedList", '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>', "Bullets"],
  ["insertOrderedList", '<span style="font-size:12px">1.</span>', "Numbered list"],
  ["createLink", '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>', "Link"],
  ["removeFormat", '<span style="font-size:12px;text-decoration:line-through">T</span>', "Clear formatting"],
];
const fmtBar = () => `<div class="fmt">${FMT.map(([c, h, t]) => `<button type="button" data-cmd="${c}" title="${t}">${h}</button>`).join("")}</div>`;
function wireFmt(root, editor) {
  root.querySelector(".fmt").addEventListener("mousedown", e => {
    const b = e.target.closest("[data-cmd]"); if (!b) return;
    e.preventDefault();
    editor.focus();
    if (b.dataset.cmd === "createLink") {
      const sel = getSelection().rangeCount ? getSelection().getRangeAt(0) : null;
      ask("Link address", { ok: "Add link", input: "https://" }).then(u => {
        if (!u || u === "https://") return;
        editor.focus();
        if (sel) { getSelection().removeAllRanges(); getSelection().addRange(sel); }
        document.execCommand("createLink", false, u);
      });
    } else document.execCommand(b.dataset.cmd);
  });
}

function sigHTML(ident, isReply) {
  if (!ident || !ident.signatureHtml || (isReply && !ident.signatureOnReplies)) return "";
  return ident.signatureHtml;
}

function defaultIdentity() {
  return identById(S.settings.defaultIdentity) ||
    (S.account && S.identities.find(i => i.accountId === S.account && i.default)) ||
    S.identities.find(i => i.default) || S.identities[0];
}

async function replyTo(m, kind) {
  try {
    const d = await api("/api/draft", { accountId: m.accountId, id: m.id, kind });
    compose({ ...d, kind, replyAccountId: m.accountId, forwardFrom: { accountId: m.accountId, msgId: m.id } });
  } catch (e) { toast(e.message, 6000); }
}

function compose(d = {}) {
  if (!S.identities.length) { toast("Add an account first."); return openSettings("accounts"); }
  const isReply = !!d.kind;
  let ident = identById(d.identityId) || defaultIdentity();
  const files = [];
  const fwd = (d.attachments || []).map(a => ({ ...a, accountId: d.forwardFrom.accountId, msgId: d.forwardFrom.msgId }));
  const byAcct = {};
  S.identities.forEach(i => (byAcct[i.accountId] = byAcct[i.accountId] || []).push(i));
  const fromOpts = S.accounts.filter(a => byAcct[a.id]).map(a => `<optgroup label="${esc(a.name || a.email)}">${byAcct[a.id].map(i =>
    `<option value="${esc(i.id)}" ${i.id === ident.id ? "selected" : ""}>${esc(i.name ? `${i.name} <${i.email}>` : i.email)}</option>`).join("")}</optgroup>`).join("");
  const title = d.draft ? "Draft" : d.kind === "forward" ? "Forward" : isReply ? "Reply" : "New message";
  const hasCc = (d.cc || []).length > 0, hasBcc = (d.bcc || []).length > 0;
  // draft is the saved copy on the server, if any.
  let draft = d.draft || null;
  $("#modal").innerHTML = `<div class="overlay"><div class="dialog compose">
    <div class="dlg-head"><h3>${title}</h3><button class="x" data-close title="Close">${icon("x")}</button></div>
    <div class="cfield"><label>From</label><select id="cFrom">${fromOpts}</select></div>
    <div class="cfield"><label>To</label><input id="cTo" value="${esc(addrList(d.to))}" autocomplete="off" spellcheck="false">
      <span class="extra"><button class="link" id="cShowCc" ${hasCc ? "hidden" : ""}>Cc</button><button class="link" id="cShowBcc">Bcc</button></span></div>
    <div class="cfield" id="cCcRow" ${hasCc ? "" : "hidden"}><label>Cc</label><input id="cCc" value="${esc(addrList(d.cc))}" autocomplete="off" spellcheck="false"></div>
    <div class="cfield" id="cBccRow" ${hasBcc ? "" : "hidden"}><label>Bcc</label><input id="cBcc" value="${esc(addrList(d.bcc))}" autocomplete="off" spellcheck="false"></div>
    <div class="cfield"><label>Subject</label><input id="cSubject" value="${esc(d.subject || "")}"></div>
    ${fmtBar()}
    <div class="editor-wrap"><div class="editor" id="cBody" contenteditable="true"></div></div>
    <div class="files" id="cFiles"></div>
    <div class="dlg-foot">
      <button class="btn primary" id="cSend" title="Send (Ctrl+Enter)">${icon("sent", 16)}Send</button>
      <label class="btn ghost" title="Attach files">${icon("clip", 16)}Attach<input type="file" id="cAttach" multiple hidden></label>
      <span class="err" id="cErr"></span><span class="grow"></span>
      <span class="dim" id="cSaved"></span>
      <span class="dim" id="cVia"></span>
      <button class="btn ghost" id="cDiscard">${d.draft ? "Delete draft" : "Discard"}</button>
    </div></div></div>`;
  const root = $("#modal");
  const body = $("#cBody");
  body.innerHTML = d.html !== undefined ? d.html : `<div><br></div><div><br></div><div class="cm-signature">${sigHTML(ident, isReply)}</div>${d.quoteHtml ? "<br>" + d.quoteHtml : ""}`;
  wireFmt(root, body);
  // A click in the blank space under a short message would land after the
  // signature. Put the caret on the first line instead, where you write.
  root.querySelector(".editor-wrap").addEventListener("mousedown", e => {
    if ((e.target === body || e.target.classList.contains("editor-wrap")) && body.querySelector(".cm-signature") && !body.textContent.replace(sigText(body.querySelector(".cm-signature").innerHTML), "").trim()) {
      e.preventDefault();
      body.focus();
      const r = document.createRange(); r.setStart(body.firstChild, 0); r.collapse(true);
      getSelection().removeAllRanges(); getSelection().addRange(r);
    }
  });

  const via = () => {
    const a = acctById(ident.accountId) || {};
    $("#cVia").textContent = "Sends through " + (a.name || a.email || "");
  };
  via();
  $("#cFrom").onchange = e => {
    ident = identById(e.target.value);
    let sig = body.querySelector(".cm-signature");
    if (!sig) { sig = document.createElement("div"); sig.className = "cm-signature"; body.insertBefore(sig, body.querySelector(".cm-quote")?.previousSibling || null); }
    sig.innerHTML = sigHTML(ident, isReply);
    via();
  };
  ["cTo", "cCc", "cBcc"].forEach(id => suggestOn($("#" + id)));
  $("#cShowCc").onclick = () => { $("#cCcRow").hidden = false; $("#cShowCc").hidden = true; $("#cCc").focus(); };
  $("#cShowBcc").onclick = () => { $("#cBccRow").hidden = false; $("#cShowBcc").hidden = true; $("#cBcc").focus(); };

  const renderFiles = () => {
    $("#cFiles").innerHTML = fwd.map((f, i) => `<span class="file-chip" title="From the original message">${icon("clip", 13)}<span>${esc(f.name)}</span><small class="dim">${fmtSize(f.size)}</small><button data-fwd="${i}" title="Remove">${icon("x", 12)}</button></span>`).join("") +
      files.map((f, i) => `<span class="file-chip">${icon("clip", 13)}<span>${esc(f.name)}</span><small class="dim">${fmtSize(f.size)}</small><button data-file="${i}" title="Remove">${icon("x", 12)}</button></span>`).join("");
  };
  renderFiles();
  $("#cFiles").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.fwd) fwd.splice(+b.dataset.fwd, 1); else files.splice(+b.dataset.file, 1);
    renderFiles();
  };
  const addFiles = list => { for (const f of list) files.push(f); renderFiles(); };
  $("#cAttach").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  root.querySelector(".dialog").addEventListener("dragover", e => e.preventDefault());
  root.querySelector(".dialog").addEventListener("drop", e => { if (e.dataTransfer.files.length) { e.preventDefault(); addFiles(e.dataTransfer.files); } });

  // payload is what both Send and Save draft post.
  const payload = async () => {
    const clone = body.cloneNode(true);
    clone.querySelectorAll(".cm-signature").forEach(s => { if (!s.textContent.trim() && !s.querySelector("img")) s.remove(); });
    const out = [];
    for (const f of files) out.push({ name: f.name, mimeType: f.type || "application/octet-stream", data: await b64(f) });
    return {
      identityId: ident.id, to: $("#cTo").value, cc: $("#cCc").value, bcc: $("#cBcc").value,
      subject: $("#cSubject").value, html: clone.innerHTML, files: out,
      forward: fwd.map(f => ({ accountId: f.accountId, msgId: f.msgId, id: f.id, name: f.name, mimeType: f.mimeType, size: f.size })),
      inReplyTo: d.inReplyTo || "", references: d.references || "", threadId: d.threadId || "", replyAccountId: d.replyAccountId || "",
      origId: (d.forwardFrom && !d.draft) ? d.forwardFrom.msgId : "", kind: d.kind || "",
      draftId: draft ? draft.id : "", draftAccountId: draft ? draft.accountId : "",
    };
  };

  // Drafts save themselves a few seconds after you stop typing, and the
  // Save button saves right away.
  let dirty = false, saving = null, timer = null, closed = false;
  const saveDraft = async () => {
    if (saving) return saving;
    saving = (async () => {
      try {
        const r = await api("/api/draft/save", await payload());
        draft = { id: r.draftId, accountId: r.accountId };
        dirty = false;
        if (!closed) $("#cSaved").textContent = "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        if (!closed) $("#cDiscard").textContent = "Delete draft";
        if (S.folder === "drafts") loadList.quiet();
      } catch (e) {
        if (!closed) $("#cSaved").textContent = "Couldn't save draft: " + e.message;
      } finally { saving = null; }
    })();
    return saving;
  };
  const touched = () => {
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(() => { if (dirty && !closed) saveDraft(); }, 4000);
  };
  root.addEventListener("input", touched);
  $("#cFrom").addEventListener("change", touched);
  $("#cFiles").addEventListener("click", touched);
  const finish = () => { closed = true; clearTimeout(timer); root.innerHTML = ""; };
  const close = async () => {
    if (!dirty) return finish();
    const box = document.createElement("div");
    box.innerHTML = `<div class="overlay"><div class="dialog small">
      <div class="dlg-body" style="padding:20px 18px 6px;line-height:1.5">Keep this message as a draft?</div>
      <div class="dlg-foot" style="border-top:0;flex-wrap:wrap"><button class="btn ghost danger" id="ccDiscard">Discard</button><span class="grow"></span>
        <button class="btn ghost" data-x>Keep writing</button><button class="btn primary" id="ccSave">Save draft</button></div></div></div>`;
    root.append(box);
    box.querySelector("[data-x]").onclick = () => box.remove();
    box.querySelector("#ccSave").onclick = async () => { box.remove(); await saveDraft(); finish(); toast("Draft saved"); };
    box.querySelector("#ccDiscard").onclick = async () => {
      box.remove(); finish();
      if (draft) { api("/api/draft/delete", { accountId: draft.accountId, draftId: draft.id }).then(() => { if (S.folder === "drafts") loadList(); }).catch(() => {}); }
    };
    box.querySelector("#ccSave").focus();
  };
  root.querySelectorAll("[data-close]").forEach(b => (b.onclick = close));
  // The footer button throws the message away: the draft on the server too.
  $("#cDiscard").onclick = async () => {
    if ((dirty || draft) && !(await ask(draft ? "Delete this draft?" : "Discard this message?", { ok: draft ? "Delete" : "Discard", danger: true, cancel: "Keep writing" }))) return;
    finish();
    if (draft) api("/api/draft/delete", { accountId: draft.accountId, draftId: draft.id }).then(() => { if (S.folder === "drafts") loadList(); }).catch(() => {});
  };

  const send = async () => {
    const btn = $("#cSend");
    $("#cErr").textContent = "";
    if (!$("#cTo").value.trim() && !$("#cCc").value.trim() && !$("#cBcc").value.trim()) { $("#cErr").textContent = "Add at least one recipient."; return $("#cTo").focus(); }
    if (!$("#cSubject").value.trim() && !(await ask("Send without a subject?", { ok: "Send anyway" }))) return;
    const total = files.reduce((n, f) => n + f.size, 0) + fwd.reduce((n, f) => n + f.size, 0);
    if (total > 25 * 1048576) { $("#cErr").textContent = "Attachments are over 25 MB. Most mail servers won't accept that."; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Sending';
    clearTimeout(timer);
    if (saving) await saving;
    try {
      await api("/api/send", await payload());
      finish();
      toast("Sent from " + ident.email);
      if (S.folder === "sent" || S.folder === "drafts") loadList();
    } catch (e) {
      $("#cErr").textContent = e.message;
      btn.disabled = false; btn.innerHTML = icon("sent", 16) + "Send";
    }
  };
  $("#cSend").onclick = send;
  root.querySelector(".dialog").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
  });
  (isReply && d.kind !== "forward" ? body : $("#cTo")).focus();
  if (isReply && d.kind !== "forward") { const r = document.createRange(); r.setStart(body.firstChild, 0); r.collapse(true); getSelection().removeAllRanges(); getSelection().addRange(r); }
}
// suggestOn adds address suggestions under a recipient box. It looks up
// the part after the last comma and fills in "Name <email>, " when picked.
function suggestOn(input) {
  let box = null, hits = [], cur = -1, timer = null, seq = 0;
  const unbox = () => { if (box) box.remove(); box = null; };
  const hide = () => { unbox(); hits = []; cur = -1; };
  const parts = () => { const v = input.value; const i = v.lastIndexOf(","); return [i < 0 ? "" : v.slice(0, i + 1), (i < 0 ? v : v.slice(i + 1)).trim()]; };
  const pick = h => { const [head] = parts(); input.value = (head ? head + " " : "") + (h.name ? `${h.name} <${h.email}>` : h.email) + ", "; hide(); input.dispatchEvent(new Event("input", { bubbles: true })); };
  const show = () => {
    unbox();
    if (!hits.length) return;
    box = document.createElement("div"); box.className = "suggest";
    box.innerHTML = hits.map((h, i) => `<div data-i="${i}" class="${i === cur ? "on" : ""}"><span>${esc(h.name || h.email)}</span>${h.name ? `<span class="em">${esc(h.email)}</span>` : ""}</div>`).join("");
    box.onmousedown = e => { e.preventDefault(); const d = e.target.closest("[data-i]"); if (d) pick(hits[+d.dataset.i]); };
    input.parentElement.append(box);
  };
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const [, tail] = parts();
    if (tail.length < 1) return hide();
    timer = setTimeout(async () => {
      const my = ++seq;
      try { const r = await api(dl("/api/contacts", { q: tail })); if (my !== seq) return; hits = r.filter(h => !input.value.toLowerCase().includes(h.email.toLowerCase())); cur = hits.length ? 0 : -1; show(); }
      catch { hide(); }
    }, 150);
  });
  input.addEventListener("keydown", e => {
    if (!box) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cur = (cur + 1) % hits.length; show(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cur = (cur - 1 + hits.length) % hits.length; show(); }
    else if ((e.key === "Enter" || e.key === "Tab") && cur >= 0) { e.preventDefault(); pick(hits[cur]); }
    else if (e.key === "Escape") { e.stopPropagation(); hide(); }
  });
  input.addEventListener("blur", () => setTimeout(hide, 120));
}
const b64 = f => new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = () => bad(r.error); r.readAsDataURL(f); });
$("#composeBtn").onclick = () => { setDrawer(false); compose(); };

/* ---------- settings ---------- */
let settingsTab = "accounts";
function openSettings(tab) {
  if (tab) settingsTab = tab;
  $("#modal").innerHTML = `<div class="overlay"><div class="dialog wide">
    <div class="dlg-head"><h3>Settings</h3><button class="x" data-close title="Close">${icon("x")}</button></div>
    <div class="tabs">${[["accounts", "Accounts"], ["identities", "From addresses and signatures"], ["setup", "Sign-in setup"], ["general", "General"]].map(([k, l]) =>
      `<button data-tab="${k}" class="${settingsTab === k ? "active" : ""}">${l}</button>`).join("")}</div>
    <div class="dlg-body" id="setBody"></div></div></div>`;
  const root = $("#modal");
  root.querySelector("[data-close]").onclick = () => { root.innerHTML = ""; };
  root.querySelector(".tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) openSettings(b.dataset.tab); };
  ({ accounts: renderAccounts, identities: renderIdentities, setup: renderSetup, general: renderGeneral })[settingsTab]();
}

function renderAccounts() {
  const st = S.settings;
  const gReady = st.googleClientId && st.googleClientSecret, mReady = st.microsoftClientId;
  $("#setBody").innerHTML = `
    ${S.accounts.map(a => `<div class="card"><div class="card-row">
      <span class="acct-dot" style="background:${esc(a.color)};width:14px;height:14px"></span>
      <div class="grow"><h4>${esc(a.name || a.email)} ${a.needsReconnect ? '<span class="badge warn">Sign-in expired</span>' : ""}</h4>
        <div class="muted">${esc(a.email)} · ${a.provider === "gmail" ? "Gmail" : "Outlook"}</div></div>
      ${a.needsReconnect ? `<button class="btn small primary" data-reconnect="${esc(a.id)}">Reconnect</button>` : ""}
      <button class="btn small" data-edit-acct="${esc(a.id)}">Edit</button>
      <button class="btn small ghost danger" data-remove="${esc(a.id)}">Remove</button></div></div>`).join("") ||
      '<p class="muted">No accounts yet.</p>'}
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn primary" data-connect="gmail">Add Gmail account</button>
      <button class="btn primary" data-connect="outlook">Add Outlook account</button>
    </div>
    ${!gReady || !mReady ? `<p class="muted" style="margin-top:14px;line-height:1.5">Before your first ${!gReady && !mReady ? "Gmail or Outlook" : !gReady ? "Gmail" : "Outlook"} account, fill in <button class="link" data-tab-go="setup">Sign-in setup</button>. It's a one-time step.</p>` : ""}`;
  const body = $("#setBody");
  body.onclick = async e => {
    const t = e.target;
    if (t.dataset.tabGo) return openSettings(t.dataset.tabGo);
    if (t.dataset.connect) return connect(t.dataset.connect);
    if (t.dataset.reconnect) { const a = acctById(t.dataset.reconnect); return connect(a.provider, a.id); }
    if (t.dataset.remove) {
      const a = acctById(t.dataset.remove);
      if (!(await ask(`Remove ${a.email} from Project Echo Mike? Its mail stays on ${a.provider === "gmail" ? "Gmail" : "Outlook"}. Its aliases and signatures here are deleted.`, { ok: "Remove", danger: true }))) return;
      try { await api("/api/account/remove", { id: a.id }); } catch (err) { return toast(err.message); }
      if (S.account === a.id) S.account = "";
      await refreshState(); renderAccounts(); loadList();
    }
    if (t.dataset.editAcct) editAccount(acctById(t.dataset.editAcct));
  };
}

function editAccount(a) {
  let color = a.color;
  const box = document.createElement("div");
  box.innerHTML = `<div class="overlay"><div class="dialog small">
    <div class="dlg-head"><h3>Edit account</h3><button class="x" data-x>${icon("x")}</button></div>
    <div class="dlg-body">
      <label class="field"><span>Name shown in the sidebar</span><input class="input" id="aName" value="${esc(a.name)}"></label>
      <div class="field"><span>Color</span><div class="color-pick">${COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c === color ? "on" : ""}"></button>`).join("")}</div></div>
    </div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="aSave">Save</button></div></div></div>`;
  $("#modal").append(box);
  box.querySelectorAll("[data-x]").forEach(b => (b.onclick = () => box.remove()));
  box.querySelector(".color-pick").onclick = e => {
    if (!e.target.dataset.c) return;
    color = e.target.dataset.c;
    box.querySelectorAll(".color-pick button").forEach(b => b.classList.toggle("on", b.dataset.c === color));
  };
  box.querySelector("#aSave").onclick = async () => {
    try { await api("/api/account/update", { id: a.id, name: box.querySelector("#aName").value, color }); } catch (e) { return toast(e.message); }
    box.remove(); await refreshState(); renderAccounts(); renderList();
  };
}

async function connect(provider, accountId) {
  const st = S.settings;
  if (provider === "gmail" && !(st.googleClientId && st.googleClientSecret) || provider === "outlook" && !st.microsoftClientId) {
    toast("Fill in Sign-in setup first.", 4000);
    return openSettings("setup");
  }
  const box = document.createElement("div");
  box.innerHTML = `<div class="overlay"><div class="dialog small">
    <div class="dlg-head"><h3>Sign in to ${provider === "gmail" ? "Google" : "Microsoft"}</h3></div>
    <div class="dlg-body" style="display:flex;gap:14px;align-items:flex-start"><div class="spin" style="margin-top:2px"></div>
      <div style="line-height:1.5">Your browser opened the sign-in page. Finish there, then come back here.<br>
      <span class="muted">If Google says the app isn't verified, click Advanced, then Go to Project Echo Mike. It's your own app.</span></div></div>
    <div class="dlg-foot"><span class="grow"></span><button class="btn ghost" id="cxl">Cancel</button></div></div></div>`;
  $("#modal").append(box);
  box.querySelector("#cxl").onclick = () => api("/api/connect/cancel", {}).catch(() => {});
  try {
    const r = await api("/api/connect", { provider, accountId: accountId || "" });
    box.remove();
    await refreshState();
    toast(`Connected ${r.email}` + (r.aliases ? `, with ${r.aliases} send-as address${r.aliases === 1 ? "" : "es"}` : ""));
    renderAccounts(); loadList(); pollUnread();
  } catch (e) {
    box.remove();
    if (!/cancel/i.test(e.message)) toast(e.message, 8000);
  }
}
