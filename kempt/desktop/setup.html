<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Connect</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #1e1f22; color: #dbdee1; font: 15px "Segoe UI", system-ui, sans-serif; }
      form { background: #313338; padding: 32px; border-radius: 10px; width: 420px; }
      h1 { margin: 0 0 6px; font-size: 22px; color: #f2f3f5; }
      p { color: #949ba4; margin: 0 0 18px; }
      label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #949ba4; }
      input { width: 100%; box-sizing: border-box; margin: 6px 0 16px; padding: 10px; border-radius: 4px; border: 1px solid #111; background: #1e1f22; color: #fff; font: inherit; }
      button { width: 100%; padding: 11px; border: 0; border-radius: 4px; background: #3d9b84; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .err { color: #f23f43; min-height: 20px; font-size: 14px; }
    </style>
  </head>
  <body>
    <form id="f">
      <h1>Connect to your server</h1>
      <p>Paste the address you use in the browser, like https://chat.example.com or an invite link.</p>
      <label for="u">Server address</label>
      <input id="u" autofocus placeholder="https://" />
      <div class="err" id="e"></div>
      <button>Connect</button>
    </form>
    <script>
      const q = new URLSearchParams(location.search);
      document.getElementById("u").value = q.get("current") || "";
      if (q.get("error")) document.getElementById("e").textContent = q.get("error");
      document.getElementById("f").onsubmit = (ev) => {
        ev.preventDefault();
        let v = document.getElementById("u").value.trim();
        if (!/^https?:\/\//.test(v)) v = "https://" + v;
        location.href = "kempt-setup://connect?url=" + encodeURIComponent(v);
      };
    </script>
  </body>
</html>
