name: Kempt release

# Publishes a GitHub release when a tag like kempt-v1.5.0 is pushed. Kempt's
# built-in updater reads the latest release and verifies SHA256SUMS.txt.
on:
  push:
    tags:
      - "kempt-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cpc/go.mod
          cache-dependency-path: cpc/go.sum
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#kempt-v}"
          ./build.sh "$VERSION"
          cd dist && sha256sum Kempt.exe Kempt-arm64.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#kempt-v}"
          gh release create "$GITHUB_REF_NAME" dist/Kempt.exe dist/Kempt-arm64.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Kempt $VERSION" --generate-notes
