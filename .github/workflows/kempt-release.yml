name: Kempt release

# Publishes a GitHub release when a tag like kempt-v1.5.0 is pushed. Kempt's
# built-in updater reads the latest release and verifies SHA256SUMS.txt.
on:
  push:
    tags:
      - "kempt-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.5.0 (tags kempt-v<version> at this commit)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpc
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cpc/go.mod
          cache-dependency-path: cpc/go.sum
      - name: Build
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#kempt-v}}"
          ./build.sh "$VERSION"
          cd dist && sha256sum Kempt.exe Kempt-arm64.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#kempt-v}}"
          gh release create "kempt-v$VERSION" dist/Kempt.exe dist/Kempt-arm64.exe dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kempt $VERSION" --generate-notes
