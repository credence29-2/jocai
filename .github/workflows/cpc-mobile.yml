name: Kempt Mobile build

on:
  push:
    paths:
      - "cpc-mobile/**"
      - ".github/workflows/cpc-mobile.yml"
  pull_request:
    paths:
      - "cpc-mobile/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpc-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease lintRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "Kempt-Mobile-1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Kempt-Mobile
          path: cpc-mobile/Kempt-Mobile-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: cpc-mobile/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
