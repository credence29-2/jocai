name: Docket build

on:
  push:
    paths:
      - "docket/**"
      - ".github/workflows/docket.yml"
  pull_request:
    paths:
      - "docket/**"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: docket
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docket/requirements-dev.txt
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Test, build and package
        run: ./build.ps1 -Version "0.1.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Docket
          path: |
            docket/dist/Docket-Setup-*.exe
            docket/dist/Docket-portable.exe
