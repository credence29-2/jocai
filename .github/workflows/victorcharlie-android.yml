name: Victor Charlie Android app

on:
  push:
    paths:
      - "victorcharlie/android/**"
      - ".github/workflows/victorcharlie-android.yml"
  pull_request:
    paths:
      - "victorcharlie/android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victorcharlie/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease lintRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "VictorCharlie-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VictorCharlie-Android
          path: victorcharlie/android/VictorCharlie-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: victorcharlie/android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
