name: Victor Charlie server

on:
  push:
    paths:
      - "victorcharlie/**"
      - "!victorcharlie/desktop/**"
      - "!victorcharlie/android/**"
      - ".github/workflows/victorcharlie.yml"
  pull_request:
    paths:
      - "victorcharlie/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: victorcharlie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: victorcharlie/go.mod
          cache-dependency-path: victorcharlie/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: victorcharlie/web/package-lock.json
      - name: Typecheck and build web app, then server
        run: ./build.sh "0.1.${{ github.run_number }}"
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Install Playwright
        working-directory: victorcharlie/test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: End-to-end test (3 people, voice, screen share, roles)
        run: node test/e2e.mjs dist/victorcharlie-server-linux-amd64 test-shots
      - uses: actions/upload-artifact@v4
        with:
          name: VictorCharlie-server
          path: |
            victorcharlie/dist/victorcharlie-server.exe
            victorcharlie/dist/victorcharlie-server-linux-amd64
            victorcharlie/dist/victorcharlie-server-linux-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: victorcharlie/test-shots/
          if-no-files-found: ignore

  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VictorCharlie-server
      - name: Start the Windows server and check it answers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          '{"http_port": 18080, "lan_only": true}' | Set-Content data/victorcharlie.json
          $p = Start-Process -FilePath .\victorcharlie-server.exe -ArgumentList "-data", "data" -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://localhost:18080/api/info; $ok = $true; break } catch {}
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "server did not answer" }
          "Server answered: $($r | ConvertTo-Json -Compress)"
