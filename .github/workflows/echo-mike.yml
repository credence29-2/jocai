name: Project Echo Mike build

on:
  push:
    paths:
      - "echo-mike/**"
      - ".github/workflows/echo-mike.yml"
  pull_request:
    paths:
      - "echo-mike/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: echo-mike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: echo-mike/go.mod
          cache-dependency-path: echo-mike/go.sum
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test and build
        run: ./build.sh "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Echo-Mike
          path: |
            echo-mike/dist/ProjectEchoMike.exe
            echo-mike/dist/ProjectEchoMike-arm64.exe

  windows-test:
    # The sign-in store uses Windows DPAPI, which only runs on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: echo-mike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: echo-mike/go.mod
          cache-dependency-path: echo-mike/go.sum
      - name: Unit tests
        run: go test ./...
