name: Kempt Mobile emulator test

on:
  push:
    paths:
      - "cpc-mobile/**"
      - ".github/workflows/cpc-mobile-smoke.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    defaults:
      run:
        working-directory: cpc-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: cpc-mobile
          script: bash scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: cpc-mobile/smoke/
          if-no-files-found: ignore
